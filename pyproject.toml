[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claimlens"
version = "0.1.0"
description = "Explainable vehicle damage & total-loss triage"
requires-python = ">=3.11"
dependencies = [
    "Pillow",
    "torch",
    "torchvision",
    "ultralytics",
    "shapely",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
data = ["roboflow", "kagglehub"]


[tool.setuptools.packages.find]
include = ["claimlens*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
